name: Release

# Reemplaza a codemagic.yaml (nunca conectada como app en Codemagic, sin builds
# reales). Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY configurados en
# Settings > Secrets and variables > Actions de este repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter test

      - name: Restaurar keystore de release
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/nexfit-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=nexfit-release.jks
          EOF

      - name: Compilar APK (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Compilar AAB (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Verificar que el tag coincide con pubspec.yaml
        id: tag
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          expected="v$version"
          actual="${{ github.ref_name }}"
          if [ "$actual" != "$expected" ]; then
            echo "El tag pusheado ($actual) no coincide con la version de pubspec.yaml ($expected)." >&2
            exit 1
          fi
          echo "tag=$actual" >> "$GITHUB_OUTPUT"

      - name: Verificar que la version es superior a la ultima publicada
        run: node tools/verify-release-version.mjs --repo ${{ github.repository }} --new "${{ steps.tag.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    # A20: se removio flutter_3d_controller (y con el, flutter_inappwebview),
    # que era la dependencia que forzaba windows-2022 por incompatibilidad
    # con el MSVC 14.51 de windows-latest. Si esta corrida falla en el mismo
    # punto, revertir a windows-2022.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter test

      - name: Compilar Windows (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
        shell: pwsh

      - name: Empaquetar build de Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nexfit-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: nexfit-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.tag }}
          generate_release_notes: true
          files: |
            android-apk/app-release.apk
            android-aab/app-release.aab
            windows-zip/nexfit-windows.zip
