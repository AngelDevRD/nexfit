name: Release

# Reemplaza a codemagic.yaml (nunca conectada como app en Codemagic, sin builds
# reales). Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY configurados en
# Settings > Secrets and variables > Actions de este repo.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - run: flutter pub get

      - run: flutter test

      - name: Compilar APK (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Calcular tag desde pubspec.yaml
        id: tag
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verificar que la version es superior a la ultima publicada
        run: node tools/verify-release-version.mjs --repo ${{ github.repository }} --new "${{ steps.tag.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    # windows-latest ya trae MSVC 14.51 (VS 2026), que elimino los headers
    # <experimental/coroutine> que usan flutter_inappwebview_windows y otros
    # plugins nativos -- windows-2022 todavia trae el toolchain compatible.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Compilar Windows (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
        shell: pwsh

      - name: Empaquetar build de Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nexfit-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: nexfit-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.tag }}
          generate_release_notes: true
          files: |
            android-apk/app-release.apk
            windows-zip/nexfit-windows.zip
