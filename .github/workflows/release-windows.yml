name: Release Windows

# Reemplaza al windows-workflow de codemagic.yaml (instance_type: windows_x2 requiere plan de
# pago en Codemagic y por eso nunca publicaba el .zip). Este job es gratis en GitHub Actions.
# Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY configurados en
# Settings > Secrets and variables > Actions de este repo.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Compilar Windows (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
        shell: pwsh

      - name: Empaquetar build de Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nexfit-windows.zip

      - name: Calcular tag desde pubspec.yaml
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').ToString() -replace 'version:\s*', '' -replace '\+.*', ''
          echo "tag=v$($version.Trim())" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: nexfit-windows.zip
