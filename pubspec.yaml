name: appgym
description: "AppGym -- entrenador personal inteligente para gimnasio."
publish_to: 'none'

version: 1.1.2+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  intl: ^0.19.0
  google_fonts: ^8.1.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter_3d_controller: ^2.3.0
  health: ^13.3.1
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1
  connectivity_plus: ^6.1.0
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  csv: ^6.0.0
  excel: ^4.0.6
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.1+1
  build_runner: ^2.15.0

  # Ícono de la app
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
    - assets/models_3d/
    - assets/images/exercises/
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C0475"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
